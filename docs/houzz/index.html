  <style>
    :root {
      color-scheme: dark;
      --bg: #070d19;
      --surface: #0f172a;
      --border: #314159;
      --text: #f8fafc;
      --muted: #b1bfd2;
      --accent: #5ee2b6;
      --link: #65cefb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 1rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap { width: min(100% - 2.5rem, 64rem); margin-inline: auto; }
    a { color: var(--link); text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .skip { position: absolute; left: .75rem; top: -8rem; background: var(--surface); padding: .6rem; }
    .skip:focus { top: .25rem; }
    header, .preview, footer { border-top: 1px solid var(--border); }
    header { border-top: 0; border-bottom: 1px solid var(--border); }
    nav { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding-block: 1.1rem; }
    .brand { font-size: 1.05rem; font-weight: 750; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    .hero { padding-block: clamp(2.4rem, 7vw, 4.8rem) 2.3rem; background: radial-gradient(ellipse at 18% 0, #113334 0, transparent 67%); }
    h1, h2 { margin: 0; line-height: 1.13; }
    h1 { max-width: 18ch; font-size: clamp(2.55rem, 6.6vw, 4.6rem); letter-spacing: -.05em; }
    h2 { font-size: clamp(1.65rem, 3.6vw, 2.3rem); letter-spacing: -.03em; }
    p { margin: .8rem 0 0; }
    .intro { max-width: 63ch; color: var(--muted); font-size: 1.12rem; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; }
    .task { display: flex; flex-direction: column; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: clamp(1.2rem, 3vw, 2rem); }
    .task h2 { font-size: clamp(1.6rem, 2.8vw, 2rem); }
    .task p, .preview p, .workflows p { color: var(--muted); }
    .task ul { margin: .9rem 0 1.4rem; padding-left: 1.2rem; }
    .task li + li { margin-top: .35rem; }
    .button { display: inline-block; padding: .65rem 1rem; min-height: 44px; margin-top: auto; border-radius: 8px; background: var(--accent); color: #061b17; font-weight: 700; text-decoration: none; }
    .button:hover { background: #8af0ce; }
    .cost { max-width: 83ch; margin: 1.15rem 0 2.7rem; color: var(--muted); font-size: .94rem; }
    .cost strong { color: var(--text); }
    .preview, .workflows { padding-block: 2.3rem; }
    .preview p, .workflows p { max-width: 72ch; }
    .table-wrap { margin-top: 1.15rem; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .8rem .95rem; border-bottom: 1px solid var(--border); }
    thead th { color: var(--muted); background: var(--surface); font-size: .88rem; }
    tbody th { font-weight: 650; }
    tbody th span { display: block; color: var(--muted); font-weight: 400; font-size: .9rem; }
    tbody tr:last-child > * { border-bottom: 0; }
    .file-links { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; margin-top: 1rem; }
    .file-links a { display: inline-block; padding-block: .2rem; }
    .workflows { border-top: 1px solid var(--border); }
    footer { padding-block: 1.4rem; }
    @media (max-width: 40rem) {
      .cards { grid-template-columns: 1fr; }
      .wrap { width: calc(100% - 2rem); }
      .button { text-align: center; width: 100%; }
      th, td { padding: .6rem .4rem; overflow-wrap: anywhere; }
      table { font-size: .85rem; }
      tbody th span, thead th { font-size: .8rem; }
    }
  </style>
</head>

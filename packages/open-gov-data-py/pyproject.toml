[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "open-gov-data"
version = "0.1.0"
description = "Zero-dependency Python SDK and CLI for allowlisted public government-data APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "apify-works maintainers" },
]
keywords = [
  "apify",
  "rapidapi",
  "government-data",
  "sec-edgar",
  "clinicaltrials",
  "openfda",
  "uk-tenders",
  "singapore-bca",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
open-gov-data = "open_gov_data.cli:main"

[project.urls]
Repository = "https://github.com/fallRainy/apify-works"
Issues = "https://github.com/fallRainy/apify-works/issues"

